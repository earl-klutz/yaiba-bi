[project]
name = "yaiba-bi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "pytz>=2025.2",
    "scipy>=1.15.3",
    "tqdm>=4.67.3",
    "tzdata>=2025.3",
    "yaiba @ git+https://github.com/ScienceAssembly/YAIBA"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"
